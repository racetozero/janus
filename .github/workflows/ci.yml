name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg/installed

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install clang-format
        run: python -m pip install clang-format==23.1.0
      - name: Check format
        run: clang-format --dry-run --Werror src/*.cpp include/janus/*.hpp tests/*.cpp

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a
        with:
          xmake-version: 3.1.1
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgJsonGlob: vcpkg.json
          vcpkgGitCommitId: 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          runVcpkgInstall: true
          doNotCache: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.xmake/cache
          key: xmake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xmake.lua', 'vcpkg.json') }}
      - name: Build
        run: xmake f -m release -y && xmake
      - name: Test
        run: xmake test
